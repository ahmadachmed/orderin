name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy URL — prisma validate only needs the var to be present, no connection is made.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  # Tenant-isolation integration tests (issue #3 acceptance) against a real
  # throwaway Postgres with migrations applied.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orderin
          POSTGRES_PASSWORD: orderin
          POSTGRES_DB: orderin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://orderin:orderin@localhost:5432/orderin_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
